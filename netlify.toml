# Static site: the page is index.html, with no build step.
[build]
  publish = "."

# The site now lives at zakat.mazinkanuga.ca. Send the old Netlify address there permanently,
# keeping the path and any #fragment (browsers carry the fragment across the redirect).
[[redirects]]
  from = "https://lunchmoney-zakat.netlify.app/*"
  to = "https://zakat.mazinkanuga.ca/:splat"
  status = 301
  force = true

# The same policy as the meta tag in index.html, plus the headers that a meta tag cannot set
# (frame-ancestors stops other sites from showing the page in a frame and reading the token field).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.lunchmoney.dev https://api.ynab.com https://api.gold-api.com; img-src data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Start the fonts straight away instead of waiting for styles.css to name them. The paths must
    # match the @font-face URLs exactly, or the browser downloads each font twice.
    Link = "</fonts/nunito-sans.woff2>; rel=preload; as=font; type=font/woff2; crossorigin, </fonts/red-hat-mono.woff2>; rel=preload; as=font; type=font/woff2; crossorigin"

# Fonts and the stylesheet keep their file names between deploys, so these are not "immutable".
# styles.css has no stale-while-revalidate, so a page load refetches any copy older than its 5 minute
# max-age. For fonts, the stale-while-revalidate window can add one stale view after the 7 day
# max-age, up to 8 days after the fetch. HTML stays on Netlify's default.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300"
